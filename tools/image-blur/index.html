<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Blur Image &mdash; Bartrue</title>
<meta name="description" content="Apply an adjustable blur effect to an image, entirely in your browser." />
<link rel="stylesheet" href="../../assets/css/main.css" />
<script>window.BARTRUE_ROOT = "../../"; window.BARTRUE_ACTIVE = "image-blur";</script>
</head>
<body>

<div class="breadcrumbs"><a href="../../index.html">Home</a> / <a href="../../image-tools/index.html">Image Tools</a> / Blur Image</div>
<div class="tool-header">
  <div>
    <h1>Blur Image</h1>
    <p class="lede">Apply an adjustable Gaussian blur with a live preview.</p>
    <div class="tag-row"><span class="tag tag--local">Runs 100% locally</span></div>
  </div>
</div>

<div class="tool-panel">
  <div id="dropzone"></div>
  <div id="file-info" class="note" style="display:none"></div>
  <div id="options" style="display:none">
    <div class="field"><label>Blur radius (<span id="b-val">4</span>px)</label><input type="range" id="blur" min="0" max="40" value="4" /></div>
    <div id="result" class="result-preview"></div>
    <div class="btn-row" id="download-row" style="display:none"><button id="download-btn" class="btn btn--primary">Download</button></div>
  </div>
  <div id="status" class="status-line"></div>
  <div class="privacy-note">&#128274; Everything happens in-memory in this tab; nothing is uploaded.</div>
</div>

<script src="../../assets/js/tools-data.js"></script>
<script src="../../assets/js/nav.js"></script>
<script src="../../assets/js/download.js"></script>
<script src="../../assets/js/dropzone.js"></script>
<script src="../../assets/js/image/common.js"></script>

<script>
(function () {
  var bitmap = null, srcFile = null, resultBlob = null;
  Bartrue.setupImageDropzone(document.getElementById('dropzone'), {
    icon: '\u{1F4A8}',
    title: 'Drop an image here',
    onImage: function (bmp, file) {
      bitmap = bmp; srcFile = file;
      document.getElementById('file-info').style.display = '';
      document.getElementById('file-info').textContent = file.name + ' — ' + bmp.width + '×' + bmp.height;
      document.getElementById('options').style.display = '';
      render();
    }
  });

  async function render() {
    var radius = document.getElementById('blur').value;
    document.getElementById('b-val').textContent = radius;
    // Expand canvas slightly so the blur doesn't get clipped at the edges,
    // then draw the blurred image centered and crop back to original size.
    var pad = Math.ceil(radius * 2);
    var big = Bartrue.makeCanvas(bitmap.width + pad * 2, bitmap.height + pad * 2);
    var bctx = big.getContext('2d');
    bctx.filter = 'blur(' + radius + 'px)';
    bctx.drawImage(bitmap, pad, pad);
    var canvas = Bartrue.makeCanvas(bitmap.width, bitmap.height);
    canvas.getContext('2d').drawImage(big, pad, pad, bitmap.width, bitmap.height, 0, 0, bitmap.width, bitmap.height);
    var mime = srcFile.type && srcFile.type.indexOf('image/') === 0 && srcFile.type !== 'image/svg+xml' ? srcFile.type : 'image/png';
    resultBlob = await Bartrue.canvasToBlob(canvas, mime);
    Bartrue.showCanvasResult(document.getElementById('result'), canvas, Bartrue.formatBytes(resultBlob.size));
    document.getElementById('download-row').style.display = '';
  }
  document.getElementById('blur').addEventListener('input', render);
  document.getElementById('download-btn').addEventListener('click', function () {
    var ext = Bartrue.EXT_FOR_MIME[resultBlob.type] || 'png';
    Bartrue.downloadBlob(resultBlob, Bartrue.suggestName(srcFile.name, 'blurred', ext));
  });
})();
</script>
</body>
</html>
