<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Resize Image &mdash; Bartrue</title>
<meta name="description" content="Adjust image dimensions, with optional locked aspect ratio, entirely in your browser." />
<link rel="stylesheet" href="../../assets/css/main.css" />
<script>window.BARTRUE_ROOT = "../../"; window.BARTRUE_ACTIVE = "image-resize";</script>
</head>
<body>

<div class="breadcrumbs"><a href="../../index.html">Home</a> / <a href="../../image-tools/index.html">Image Tools</a> / Resize Image</div>
<div class="tool-header">
  <div>
    <h1>Resize Image</h1>
    <p class="lede">Change an image's pixel dimensions.</p>
    <div class="tag-row"><span class="tag tag--local">Runs 100% locally</span></div>
  </div>
</div>

<div class="tool-panel">
  <div id="dropzone"></div>
  <div id="file-info" class="note" style="display:none"></div>

  <div id="options" style="display:none">
    <div class="field-row">
      <div class="field"><label>Width (px)</label><input type="number" id="w" min="1" /></div>
      <div class="field"><label>Height (px)</label><input type="number" id="h" min="1" /></div>
    </div>
    <div class="checkbox-row" style="margin-bottom:16px"><input type="checkbox" id="lock" checked /><label for="lock" style="margin:0">Lock aspect ratio</label></div>
    <div class="btn-row">
      <button class="btn" data-pct="25" type="button">25%</button>
      <button class="btn" data-pct="50" type="button">50%</button>
      <button class="btn" data-pct="75" type="button">75%</button>
      <button class="btn" data-pct="200" type="button">200%</button>
    </div>
    <div class="btn-row"><button id="run-btn" class="btn btn--primary">Resize</button></div>
  </div>
  <div id="status" class="status-line"></div>

  <div id="result" class="result-preview" style="display:none"></div>
  <div class="btn-row" id="download-row" style="display:none"><button id="download-btn" class="btn btn--primary">Download</button></div>

  <div class="privacy-note">&#128274; Everything happens in-memory in this tab; nothing is uploaded.</div>
</div>

<script src="../../assets/js/tools-data.js"></script>
<script src="../../assets/js/nav.js"></script>
<script src="../../assets/js/download.js"></script>
<script src="../../assets/js/dropzone.js"></script>
<script src="../../assets/js/image/common.js"></script>

<script>
(function () {
  var bitmap = null, srcFile = null, resultBlob = null, ratio = 1;

  Bartrue.setupImageDropzone(document.getElementById('dropzone'), {
    icon: '\u{1F4D0}',
    title: 'Drop an image here',
    onImage: function (bmp, file) {
      bitmap = bmp; srcFile = file; ratio = bmp.width / bmp.height;
      document.getElementById('w').value = bmp.width;
      document.getElementById('h').value = bmp.height;
      document.getElementById('file-info').style.display = '';
      document.getElementById('file-info').textContent = file.name + ' — ' + bmp.width + '×' + bmp.height;
      document.getElementById('options').style.display = '';
      document.getElementById('result').style.display = 'none';
      document.getElementById('download-row').style.display = 'none';
    }
  });

  var wEl = document.getElementById('w'), hEl = document.getElementById('h');
  wEl.addEventListener('input', function () {
    if (document.getElementById('lock').checked) hEl.value = Math.round(wEl.value / ratio);
  });
  hEl.addEventListener('input', function () {
    if (document.getElementById('lock').checked) wEl.value = Math.round(hEl.value * ratio);
  });

  document.querySelectorAll('[data-pct]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var pct = parseInt(btn.dataset.pct, 10) / 100;
      wEl.value = Math.round(bitmap.width * pct);
      hEl.value = Math.round(bitmap.height * pct);
    });
  });

  document.getElementById('run-btn').addEventListener('click', async function () {
    var statusEl = document.getElementById('status');
    Bartrue.setStatus(statusEl, 'Resizing…', 'loading');
    try {
      var w = Math.max(1, parseInt(wEl.value, 10));
      var h = Math.max(1, parseInt(hEl.value, 10));
      var canvas = Bartrue.makeCanvas(w, h);
      canvas.getContext('2d').drawImage(bitmap, 0, 0, w, h);
      var mime = srcFile.type && srcFile.type !== 'image/svg+xml' ? srcFile.type : 'image/png';
      resultBlob = await Bartrue.canvasToBlob(canvas, mime);
      Bartrue.showCanvasResult(document.getElementById('result'), canvas, w + '×' + h + ' · ' + Bartrue.formatBytes(resultBlob.size));
      document.getElementById('download-row').style.display = '';
      Bartrue.setStatus(statusEl, 'Done.', 'success');
    } catch (e) {
      console.error(e);
      Bartrue.setStatus(statusEl, 'Could not resize this image: ' + e.message, 'error');
    }
  });

  document.getElementById('download-btn').addEventListener('click', function () {
    var ext = Bartrue.EXT_FOR_MIME[resultBlob.type] || 'png';
    Bartrue.downloadBlob(resultBlob, Bartrue.suggestName(srcFile.name, 'resized', ext));
  });
})();
</script>
</body>
</html>
