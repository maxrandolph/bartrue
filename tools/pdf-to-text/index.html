<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PDF to Text &mdash; Bartrue</title>
<meta name="description" content="Extract text content from a PDF document, entirely in your browser." />
<link rel="stylesheet" href="../../assets/css/main.css" />
<script>window.BARTRUE_ROOT = "../../"; window.BARTRUE_ACTIVE = "pdf-to-text";</script>
</head>
<body>

<div class="breadcrumbs"><a href="../../index.html">Home</a> / <a href="../../pdf-tools/index.html">PDF Tools</a> / PDF to Text</div>
<div class="tool-header">
  <div>
    <h1>PDF to Text</h1>
    <p class="lede">Pull the text out of a PDF. Best-effort: works great for normal text-based PDFs, won't find text in scanned/image-only pages (no OCR).</p>
    <div class="tag-row"><span class="tag tag--local">Runs 100% locally</span></div>
  </div>
</div>

<div class="tool-panel">
  <div id="dropzone"></div>
  <div id="file-info" class="note" style="display:none"></div>

  <div id="options" style="display:none">
    <div class="checkbox-row" style="margin-bottom:16px"><input type="checkbox" id="page-breaks" /><label for="page-breaks" style="margin:0">Insert page break markers</label></div>
    <div class="btn-row"><button id="run-btn" class="btn btn--primary">Extract Text</button></div>
  </div>
  <div id="status" class="status-line"></div>

  <div id="result" style="display:none">
    <div class="field" style="margin-top:16px">
      <label>Extracted text</label>
      <textarea id="output" rows="16" readonly></textarea>
    </div>
    <div class="btn-row"><button id="download-btn" class="btn btn--primary">Download .txt</button><button id="copy-btn" class="btn">Copy to clipboard</button></div>
  </div>

  <div class="privacy-note">&#128274; Extraction happens in-memory in this tab; nothing is uploaded.</div>
</div>

<script src="../../assets/js/tools-data.js"></script>
<script src="../../assets/js/nav.js"></script>
<script src="../../assets/js/download.js"></script>
<script src="../../assets/js/dropzone.js"></script>
<script src="../../assets/js/pdf/flate.js"></script>
<script src="../../assets/js/pdf/core.js"></script>
<script src="../../assets/js/pdf/document.js"></script>
<script src="../../assets/js/pdf/writer.js"></script>
<script src="../../assets/js/pdf/fonts.js"></script>
<script src="../../assets/js/pdf/build.js"></script>
<script src="../../assets/js/pdf/content.js"></script>
<script src="../../assets/js/pdf/font-metrics.js"></script>
<script src="../../assets/js/pdf/text-extract.js"></script>

<script>
(function () {
  var doc = null, srcFile = null;
  var statusEl = document.getElementById('status');

  Bartrue.createDropzone(document.getElementById('dropzone'), {
    accept: 'application/pdf',
    icon: '\u{1F4C4}',
    title: 'Drop a PDF file here',
    hint: 'or click to browse',
    onFiles: async function (files) {
      srcFile = files[0];
      Bartrue.setStatus(statusEl, 'Loading…', 'loading');
      try {
        var bytes = new Uint8Array(await srcFile.arrayBuffer());
        doc = await PDFDocument.load(bytes);
        var pages = await doc.getPages();
        document.getElementById('file-info').style.display = '';
        document.getElementById('file-info').textContent = srcFile.name + ' — ' + pages.length + ' page' + (pages.length === 1 ? '' : 's');
        document.getElementById('options').style.display = '';
        document.getElementById('result').style.display = 'none';
        Bartrue.setStatus(statusEl, '');
      } catch (e) {
        Bartrue.setStatus(statusEl, 'Could not read this PDF: ' + e.message, 'error');
      }
    }
  });

  var lastText = '';
  document.getElementById('run-btn').addEventListener('click', async function () {
    Bartrue.setStatus(statusEl, 'Extracting text…', 'loading');
    try {
      var pageBreaks = document.getElementById('page-breaks').checked;
      var result = await PDFTextExtract.extractDocumentText(doc, { pageBreaks: pageBreaks });
      lastText = result.text;
      document.getElementById('output').value = lastText || '(No extractable text found — this PDF may be scanned/image-only.)';
      document.getElementById('result').style.display = '';
      Bartrue.setStatus(statusEl, result.hadUnmappedGlyphs ? 'Done — some glyphs could not be mapped to Unicode and show as �.' : 'Done.', 'success');
    } catch (e) {
      console.error(e);
      Bartrue.setStatus(statusEl, 'Could not extract text: ' + e.message, 'error');
    }
  });

  document.getElementById('download-btn').addEventListener('click', function () {
    var blob = new Blob([lastText], { type: 'text/plain' });
    Bartrue.downloadBlob(blob, Bartrue.suggestName(srcFile.name, '', 'txt'));
  });
  document.getElementById('copy-btn').addEventListener('click', function () {
    navigator.clipboard.writeText(lastText).then(function () {
      Bartrue.setStatus(statusEl, 'Copied to clipboard.', 'success');
    });
  });
})();
</script>
</body>
</html>
