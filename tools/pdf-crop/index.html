<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Crop PDF &mdash; Bartrue</title>
<meta name="description" content="Trim margins from every page of a PDF, entirely in your browser." />
<link rel="stylesheet" href="../../assets/css/main.css" />
<script>window.BARTRUE_ROOT = "../../"; window.BARTRUE_ACTIVE = "pdf-crop";</script>
</head>
<body>

<div class="breadcrumbs"><a href="../../index.html">Home</a> / <a href="../../pdf-tools/index.html">PDF Tools</a> / Crop PDF</div>
<div class="tool-header">
  <div>
    <h1>Crop PDF</h1>
    <p class="lede">Trim margins from every page by entering how many points to remove from each side.</p>
    <div class="tag-row"><span class="tag tag--local">Runs 100% locally</span></div>
  </div>
</div>

<div class="tool-panel">
  <div id="dropzone"></div>
  <div id="file-info" class="note" style="display:none"></div>

  <div id="options" style="display:none">
    <p class="field-hint" style="margin-top:-6px">Current page size: <span id="page-size"></span> pt. 72 points = 1 inch.</p>
    <div class="field-row">
      <div class="field"><label>Top margin (pt)</label><input type="number" id="m-top" value="0" min="0" /></div>
      <div class="field"><label>Bottom margin (pt)</label><input type="number" id="m-bottom" value="0" min="0" /></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Left margin (pt)</label><input type="number" id="m-left" value="0" min="0" /></div>
      <div class="field"><label>Right margin (pt)</label><input type="number" id="m-right" value="0" min="0" /></div>
    </div>
    <div class="btn-row"><button id="run-btn" class="btn btn--primary">Crop PDF</button></div>
  </div>
  <div id="status" class="status-line"></div>

  <div id="result" class="result-preview" style="display:none">
    <iframe id="result-frame" style="width:100%;height:520px;border:0;background:#fff"></iframe>
    <div class="result-preview__bar">
      <span id="result-info"></span>
      <button id="download-btn" class="btn btn--primary">Download</button>
    </div>
  </div>

  <div class="privacy-note">&#128274; Cropping happens in-memory in this tab; nothing is uploaded.</div>
</div>

<script src="../../assets/js/tools-data.js"></script>
<script src="../../assets/js/nav.js"></script>
<script src="../../assets/js/download.js"></script>
<script src="../../assets/js/dropzone.js"></script>
<script src="../../assets/js/pdf/flate.js"></script>
<script src="../../assets/js/pdf/core.js"></script>
<script src="../../assets/js/pdf/document.js"></script>
<script src="../../assets/js/pdf/writer.js"></script>
<script src="../../assets/js/pdf/build.js"></script>

<script>
(function () {
  var doc = null, srcFile = null;
  var statusEl = document.getElementById('status');

  Bartrue.createDropzone(document.getElementById('dropzone'), {
    accept: 'application/pdf',
    icon: '✂️',
    title: 'Drop a PDF file here',
    hint: 'or click to browse',
    onFiles: async function (files) {
      srcFile = files[0];
      Bartrue.setStatus(statusEl, 'Loading…', 'loading');
      try {
        var bytes = new Uint8Array(await srcFile.arrayBuffer());
        doc = await PDFDocument.load(bytes);
        var pages = await doc.getPages();
        var box = await doc.getPageBox(pages[0]);
        document.getElementById('page-size').textContent = Math.round(box[2] - box[0]) + ' × ' + Math.round(box[3] - box[1]);
        document.getElementById('file-info').style.display = '';
        document.getElementById('file-info').textContent = srcFile.name + ' — ' + pages.length + ' page' + (pages.length === 1 ? '' : 's');
        document.getElementById('options').style.display = '';
        document.getElementById('result').style.display = 'none';
        Bartrue.setStatus(statusEl, '');
      } catch (e) {
        Bartrue.setStatus(statusEl, 'Could not read this PDF: ' + e.message, 'error');
      }
    }
  });

  var outputBlob = null;
  document.getElementById('run-btn').addEventListener('click', async function () {
    Bartrue.setStatus(statusEl, 'Cropping…', 'loading');
    try {
      var top = parseFloat(document.getElementById('m-top').value) || 0;
      var bottom = parseFloat(document.getElementById('m-bottom').value) || 0;
      var left = parseFloat(document.getElementById('m-left').value) || 0;
      var right = parseFloat(document.getElementById('m-right').value) || 0;
      var pages = await doc.getPages();
      for (var i = 0; i < pages.length; i++) {
        var box = await doc.getPageBox(pages[i]);
        var newBox = [box[0] + left, box[1] + bottom, box[2] - right, box[3] - top];
        if (newBox[2] <= newBox[0]) newBox[2] = newBox[0] + 1;
        if (newBox[3] <= newBox[1]) newBox[3] = newBox[1] + 1;
        pages[i].dict.MediaBox = newBox;
        pages[i].dict.CropBox = newBox.slice();
      }
      var outBytes = await doc.save();
      outputBlob = new Blob([outBytes], { type: 'application/pdf' });
      var url = URL.createObjectURL(outputBlob);
      document.getElementById('result-frame').src = url;
      document.getElementById('result-info').textContent = Bartrue.formatBytes(outputBlob.size);
      document.getElementById('result').style.display = '';
      Bartrue.setStatus(statusEl, 'Done.', 'success');
    } catch (e) {
      console.error(e);
      Bartrue.setStatus(statusEl, 'Could not crop this PDF: ' + e.message, 'error');
    }
  });

  document.getElementById('download-btn').addEventListener('click', function () {
    if (outputBlob) Bartrue.downloadBlob(outputBlob, Bartrue.suggestName(srcFile.name, 'cropped', 'pdf'));
  });
})();
</script>
</body>
</html>
