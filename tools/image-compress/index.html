<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Compress Image &mdash; Bartrue</title>
<meta name="description" content="Reduce image file size with an adjustable quality slider, entirely in your browser." />
<link rel="stylesheet" href="../../assets/css/main.css" />
<script>window.BARTRUE_ROOT = "../../"; window.BARTRUE_ACTIVE = "image-compress";</script>
</head>
<body>

<div class="breadcrumbs"><a href="../../index.html">Home</a> / <a href="../../image-tools/index.html">Image Tools</a> / Compress Image</div>
<div class="tool-header">
  <div>
    <h1>Compress Image</h1>
    <p class="lede">Re-encode a photo at a lower quality to shrink its file size.</p>
    <div class="tag-row"><span class="tag tag--local">Runs 100% locally</span></div>
  </div>
</div>

<div class="tool-panel">
  <div id="dropzone"></div>
  <div id="file-info" class="note" style="display:none"></div>

  <div id="options" style="display:none">
    <div class="field-row">
      <div class="field">
        <label>Output format</label>
        <select id="format">
          <option value="image/jpeg" selected>JPEG</option>
          <option value="image/webp">WebP</option>
          <option value="image/png">PNG (lossless — quality has no effect)</option>
        </select>
      </div>
      <div class="field">
        <label>Quality (<span id="q-val">70</span>%)</label>
        <input type="range" id="quality" min="1" max="100" value="70" />
      </div>
    </div>
    <div class="btn-row"><button id="run-btn" class="btn btn--primary">Compress</button></div>
  </div>
  <div id="status" class="status-line"></div>

  <div id="result" class="result-preview" style="display:none"></div>
  <div class="btn-row" id="download-row" style="display:none"><button id="download-btn" class="btn btn--primary">Download</button></div>

  <div class="privacy-note">&#128274; Everything happens in-memory in this tab; nothing is uploaded.</div>
</div>

<script src="../../assets/js/tools-data.js"></script>
<script src="../../assets/js/nav.js"></script>
<script src="../../assets/js/download.js"></script>
<script src="../../assets/js/dropzone.js"></script>
<script src="../../assets/js/image/common.js"></script>

<script>
(function () {
  var bitmap = null, srcFile = null, resultBlob = null;
  var statusEl = document.getElementById('status');

  Bartrue.setupImageDropzone(document.getElementById('dropzone'), {
    icon: '\u{1F5DC}️',
    title: 'Drop an image here',
    onImage: function (bmp, file) {
      bitmap = bmp; srcFile = file;
      document.getElementById('file-info').style.display = '';
      document.getElementById('file-info').textContent = file.name + ' — ' + bmp.width + '×' + bmp.height + ' · ' + Bartrue.formatBytes(file.size);
      document.getElementById('options').style.display = '';
      document.getElementById('result').style.display = 'none';
      document.getElementById('download-row').style.display = 'none';
      Bartrue.setStatus(statusEl, '');
    },
    onError: function () { Bartrue.setStatus(statusEl, 'Could not read this image.', 'error'); }
  });

  document.getElementById('quality').addEventListener('input', function () {
    document.getElementById('q-val').textContent = this.value;
  });

  document.getElementById('run-btn').addEventListener('click', async function () {
    Bartrue.setStatus(statusEl, 'Compressing…', 'loading');
    try {
      var canvas = Bartrue.makeCanvas(bitmap.width, bitmap.height);
      var ctx = canvas.getContext('2d');
      if (document.getElementById('format').value !== 'image/png') {
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }
      ctx.drawImage(bitmap, 0, 0);
      var mime = document.getElementById('format').value;
      var quality = parseInt(document.getElementById('quality').value, 10) / 100;
      resultBlob = await Bartrue.canvasToBlob(canvas, mime, quality);
      var pct = srcFile.size > 0 ? Math.round((1 - resultBlob.size / srcFile.size) * 100) : 0;
      Bartrue.showCanvasResult(document.getElementById('result'), canvas,
        Bartrue.formatBytes(srcFile.size) + ' → ' + Bartrue.formatBytes(resultBlob.size) + (pct > 0 ? ' (' + pct + '% smaller)' : ''));
      document.getElementById('download-row').style.display = '';
      Bartrue.setStatus(statusEl, 'Done.', 'success');
    } catch (e) {
      console.error(e);
      Bartrue.setStatus(statusEl, 'Could not compress this image: ' + e.message, 'error');
    }
  });

  document.getElementById('download-btn').addEventListener('click', function () {
    var ext = Bartrue.EXT_FOR_MIME[document.getElementById('format').value] || 'jpg';
    Bartrue.downloadBlob(resultBlob, Bartrue.suggestName(srcFile.name, 'compressed', ext));
  });
})();
</script>
</body>
</html>
