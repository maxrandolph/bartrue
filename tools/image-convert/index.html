<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Convert Image &mdash; Bartrue</title>
<meta name="description" content="Change an image between JPG, PNG and WebP, entirely in your browser." />
<link rel="stylesheet" href="../../assets/css/main.css" />
<script>window.BARTRUE_ROOT = "../../"; window.BARTRUE_ACTIVE = "image-convert";</script>
</head>
<body>

<div class="breadcrumbs"><a href="../../index.html">Home</a> / <a href="../../image-tools/index.html">Image Tools</a> / Convert Image</div>
<div class="tool-header">
  <div>
    <h1>Convert Image</h1>
    <p class="lede">Convert between JPG, PNG and WebP. Reads pretty much anything your browser can display, including GIF and BMP.</p>
    <div class="tag-row"><span class="tag tag--local">Runs 100% locally</span></div>
  </div>
</div>

<div class="tool-panel">
  <div id="dropzone"></div>
  <div id="file-info" class="note" style="display:none"></div>

  <div id="options" style="display:none">
    <div class="field-row">
      <div class="field">
        <label>Convert to</label>
        <select id="format">
          <option value="image/png">PNG</option>
          <option value="image/jpeg" selected>JPG</option>
          <option value="image/webp">WebP</option>
        </select>
      </div>
      <div class="field" id="q-field">
        <label>Quality (<span id="q-val">85</span>%)</label>
        <input type="range" id="quality" min="1" max="100" value="85" />
      </div>
    </div>
    <div class="field" id="bg-field" style="display:none">
      <label>Background color (for transparent areas)</label>
      <input type="color" id="bg-color" value="#ffffff" style="max-width:120px" />
    </div>
    <div class="btn-row"><button id="run-btn" class="btn btn--primary">Convert</button></div>
  </div>
  <div id="status" class="status-line"></div>

  <div id="result" class="result-preview" style="display:none"></div>
  <div class="btn-row" id="download-row" style="display:none"><button id="download-btn" class="btn btn--primary">Download</button></div>

  <div class="privacy-note">&#128274; Everything happens in-memory in this tab; nothing is uploaded.</div>
</div>

<script src="../../assets/js/tools-data.js"></script>
<script src="../../assets/js/nav.js"></script>
<script src="../../assets/js/download.js"></script>
<script src="../../assets/js/dropzone.js"></script>
<script src="../../assets/js/image/common.js"></script>

<script>
(function () {
  var bitmap = null, srcFile = null, resultBlob = null;

  Bartrue.setupImageDropzone(document.getElementById('dropzone'), {
    icon: '\u{1F504}',
    title: 'Drop an image here',
    accept: 'image/*',
    onImage: function (bmp, file) {
      bitmap = bmp; srcFile = file;
      document.getElementById('file-info').style.display = '';
      document.getElementById('file-info').textContent = file.name + ' — ' + bmp.width + '×' + bmp.height + ' · ' + Bartrue.formatBytes(file.size);
      document.getElementById('options').style.display = '';
      document.getElementById('result').style.display = 'none';
      document.getElementById('download-row').style.display = 'none';
      toggleFields();
    },
    onError: function () { Bartrue.setStatus(document.getElementById('status'), 'Could not read this image — the format may not be supported by your browser.', 'error'); }
  });

  function toggleFields() {
    var fmt = document.getElementById('format').value;
    document.getElementById('q-field').style.display = fmt === 'image/png' ? 'none' : '';
    document.getElementById('bg-field').style.display = fmt === 'image/jpeg' ? '' : 'none';
  }
  document.getElementById('format').addEventListener('change', toggleFields);
  document.getElementById('quality').addEventListener('input', function () {
    document.getElementById('q-val').textContent = this.value;
  });

  document.getElementById('run-btn').addEventListener('click', async function () {
    var statusEl = document.getElementById('status');
    Bartrue.setStatus(statusEl, 'Converting…', 'loading');
    try {
      var canvas = Bartrue.makeCanvas(bitmap.width, bitmap.height);
      var ctx = canvas.getContext('2d');
      var fmt = document.getElementById('format').value;
      if (fmt === 'image/jpeg') {
        ctx.fillStyle = document.getElementById('bg-color').value;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }
      ctx.drawImage(bitmap, 0, 0);
      var quality = parseInt(document.getElementById('quality').value, 10) / 100;
      resultBlob = await Bartrue.canvasToBlob(canvas, fmt, quality);
      Bartrue.showCanvasResult(document.getElementById('result'), canvas, Bartrue.formatBytes(resultBlob.size));
      document.getElementById('download-row').style.display = '';
      Bartrue.setStatus(statusEl, 'Done.', 'success');
    } catch (e) {
      console.error(e);
      Bartrue.setStatus(statusEl, 'Could not convert this image: ' + e.message, 'error');
    }
  });

  document.getElementById('download-btn').addEventListener('click', function () {
    var ext = Bartrue.EXT_FOR_MIME[resultBlob.type] || 'png';
    Bartrue.downloadBlob(resultBlob, Bartrue.suggestName(srcFile.name, '', ext));
  });
})();
</script>
</body>
</html>
